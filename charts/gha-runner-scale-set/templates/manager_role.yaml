{{- $meta := and .Values.resourceMeta .Values.resourceMeta.managerRole }}
{{- $annotations := include "gha-runner-scale-set.effective-annotations" (dict "ctx" . "meta" $meta) | fromJson }}
apiVersion: "rbac.authorization.k8s.io/v1"
kind: "Role"
metadata: {
  name: {{ include "gha-runner-scale-set.managerRoleName" . | toJson }},
  namespace: {{ include "gha-runner-scale-set.namespace" . | toJson }},
  labels: {{ include "gha-runner-scale-set.effective-labels" (dict "ctx" . "meta" $meta "component" "manager-role") }},
  {{- if $annotations }}
  annotations: {{ $annotations | toJson }},
  {{- end }}
  finalizers: ["actions.github.com/cleanup-protection"],
}
rules: [{
  apiGroups: [""],
  resources: ["pods"],
  verbs: ["create", "delete", "get"],
}, {
  apiGroups: [""],
  resources: ["pods/status"],
  verbs: ["get"],
}, {
  apiGroups: [""],
  resources: ["secrets"],
  verbs: ["create", "delete", "get", "list", "patch", "update"],
}, {
  apiGroups: [""],
  resources: ["serviceaccounts"],
  verbs: ["create", "delete", "get", "list", "patch", "update"],
}, {
  apiGroups: ["rbac.authorization.k8s.io"],
  resources: ["rolebindings"],
  verbs: ["create", "delete", "get", "patch", "update"],
}, {
  apiGroups: ["rbac.authorization.k8s.io"],
  resources: ["roles"],
  verbs: ["create", "delete", "get", "patch", "update"],
},
{{- if .Values.githubServerTLS }}
{
  apiGroups: [""],
  resources: ["configmaps"],
  verbs: ["get"],
},
{{- end }}
]
