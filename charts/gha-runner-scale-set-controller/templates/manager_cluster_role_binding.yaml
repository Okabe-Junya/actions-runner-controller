{{- if empty .Values.flags.watchSingleNamespace }}
apiVersion: "rbac.authorization.k8s.io/v1"
kind: "ClusterRoleBinding"
metadata: {
  name: {{ include "gha-runner-scale-set-controller.managerClusterRoleBinding" . | toJson }},
}
roleRef: {
  apiGroup: "rbac.authorization.k8s.io",
  kind: "ClusterRole",
  name: {{ include "gha-runner-scale-set-controller.managerClusterRoleName" . | toJson }},
}
subjects: [{
  kind: "ServiceAccount",
  name: {{ include "gha-runner-scale-set-controller.serviceAccountName" . | toJson }},
  namespace: {{ include "gha-runner-scale-set-controller.namespace" . | toJson }},
}]
{{- end }}
